<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hour Glow</title>
    <meta name="description" content="A glowing body whose colour follows the sky. A singing bowl rings to mark time passing, and drawing near the light reveals the hour.">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&amp;family=Space+Grotesk:wght@400;500&amp;display=swap">
        <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--instructions and titles of what has to be done-->
    <h1 class="proto-title">Hour Glow<span>hover near the light to see the hour · press &amp; hold to breathe</span></h1>
        <main class="stage" id="stage" aria-label="explanation">
            <div class="orb" id="orb" aria-hidden="true"></div>
            <p class="whisper" id="whisper"></p>
        </main>
            <p class="hint" id="hint">press anywhere to begin listening</p>
        
    <!--preview different timings section-->
    <nav class="proto-nav" aria-label="Time of day preview">
        <span class="sep">preview:</span>
        <a href="?" data-hour="">now</a>
        <a href="?hour=5.5" data-hour="5.5">dawn</a>
        <a href="?hour=8.5" data-hour="8.5">morning</a>
        <a href="?hour=12.5" data-hour="12.5">midday</a>
        <a href="?hour=15.5" data-hour="15.5">afternoon</a>
        <a href="?hour=18" data-hour="18">dusk</a>
        <a href="?hour=23" data-hour="23">night</a>
    </nav>

     <script src="main.js"></script>
</body>
</html>
